name: Reassemble approved BMP assets
on:
  push:
    branches: [dev/0.10]
    paths:
      - 'asset-transfer/manifests/*.json'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  reassemble:
    # Historical transfer retired on 2026-11-09; no automatic asset commits.
    if: false
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Reassemble and verify
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPOSITORY: ${{ github.repository }}
        run: |
          python3 - <<'PY'
          import base64, hashlib, json, lzma, os, pathlib, urllib.request
          root = pathlib.Path('.').resolve()
          for manifest_file in sorted(pathlib.Path('asset-transfer/manifests').glob('*.json')):
              m = json.loads(manifest_file.read_text())
              target = (root / m['asset_path']).resolve()
              if not target.is_relative_to(root / 'assets'):
                  raise ValueError('Target must be under assets/')
              target.parent.mkdir(parents=True, exist_ok=True)
              digest = hashlib.sha256()
              count = 0
              with target.open('wb') as out:
                  for part in m['parts']:
                      url = 'https://api.github.com/repos/' + os.environ['GH_REPOSITORY'] + '/git/blobs/' + part['sha']
                      req = urllib.request.Request(url, headers={
                          'Authorization': 'Bearer ' + os.environ['GH_TOKEN'],
                          'Accept': 'application/vnd.github+json',
                          'X-GitHub-Api-Version': '2022-11-28'
                      })
                      with urllib.request.urlopen(req) as response:
                          obj = json.load(response)
                      encoded = base64.b64decode(obj['content'])
                      compression = m.get('compression')
                      if compression == 'xz':
                          if len(encoded) != part['encoded_size']:
                              raise ValueError('Encoded chunk size mismatch: ' + part['sha'])
                          data = lzma.decompress(encoded, format=lzma.FORMAT_XZ)
                      elif compression is None:
                          data = encoded
                      else:
                          raise ValueError('Unsupported transfer compression: ' + str(compression))
                      if len(data) != part['size']:
                          raise ValueError('Chunk length mismatch: ' + part['sha'])
                      out.write(data)
                      digest.update(data)
                      count += len(data)
              if count != m['size'] or digest.hexdigest() != m['sha256']:
                  target.unlink(missing_ok=True)
                  raise ValueError('File size or SHA-256 mismatch: ' + str(target))
              print('VERIFIED', target, count, digest.hexdigest())
          PY
      - name: Commit verified assets
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/
          if ! git diff --cached --quiet; then
            git commit -m "assets: assemble and verify approved BMP transfers"
            git push
          fi
