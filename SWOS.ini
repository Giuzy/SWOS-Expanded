
[video]
fullscreen=off
widescreen=stretch
resolution=auto
scaling=sharp
crt_mask=off
subpixel_scroll=false
renderer=accel
; vsync: true | false  (accel renderer only)
vsync=false
; crt_mask_strength: 0-100. How dark the grille's off-phase gets. 0 = invisible, 100 = black between phosphors
crt_mask_strength=45
; crt_vignette: 0-100. Darkens towards the corners like a tube's edges. 0 = off
crt_vignette=0
; crt_corners: 0-100. Rounded-glass corner size. 0 = square screen
crt_corners=0
; render_driver: auto | opengl | direct3d11 | direct3d | software-backend. auto = SDL default (D3D11 on Windows). Use opengl if replays/attract run in slow motion on Windows
render_driver=auto
; scale: window scale 1-4 (windowed only)
scale=3
; screen: monitor index to open on, 0 = primary. Auto-clamped if out of range; window size auto-fits that screen
screen=0

; --- keys added by a newer SWOS build (defaults; edit as you like) ---
[audio]
; mode: mono | stereo
mode=mono
; style: amiga | pc. A match's sounds: the Amiga's, or the PC game's sampled
; effects, crowd and chants (sound_dos/). The menus' music is the Amiga's either
; way. It changes nothing in a match: online, each player hears their own.

style=amiga
; music: amiga | pc. The music: the Amiga's, or the PC game's -- the CD
; release's title song in the intro, and menu.xmi on an emulated AdLib card with
; the game's own instruments in the menus.

music=amiga
; commentary_dir: a folder of your own commentary, one sub-folder per category
; (goal, own_goal, corner, ... -- docs/DOS_SOUND.md), .wav, .mp3 or .raw files of
; any length. Empty: sound_dos/commentary. A category without files keeps the PC
; game's lines.

commentary_dir=
; menu_music: midi | mp3. With music = pc, the menus' music is the game's
; menu.xmi played live on the emulated card (midi), or a recording of it,
; sound_dos/menu.mp3 (mp3).

menu_music=midi
; commentary: auto | true | false. The PC game's commentary. auto (the
; default): with style = pc only. true: always, over the Amiga's sounds too.

commentary=auto
[input]
; stick_deadzone: 5-90. How far an analog stick must be pushed, in percent of
; its travel, before it counts as a direction. Raise it if the stick drifts or
; feels twitchy; lower it for a lighter touch. Past it, the stick gives whichever
; of the eight directions it points nearest to. The D-pad is not affected.
stick_deadzone=25
; latch_presses: true | false. The match reads the fire button once a frame.
; true (the default): a press that was down and up again between two reads
; still counts as pressed for one frame, so a very short tap is never lost.
; false: only what is held at the moment of the read counts, as before.
latch_presses=true
; key_up, key_down, key_left, key_right, key_fire: your own keys, BESIDE the
; built-in ones (the cursor keys; either CTRL or ENTER to fire), which keep
; working. A key's name as SDL writes it: W, A, S, D, Space, Left Shift,
; Right Ctrl, Keypad 8 ... Empty: none. A key named here is a control and
; nothing else: it no longer does what it did in the game (W called the bench,
; S the statistics), except in a text field. Use these rather than an external
; key remapper, which feeds the game key presses of its own timing.
key_up=
key_down=
key_left=
key_right=
key_fire=
[gameplay]
; fire_hold_lockout: true | false — true restores a BUG IN THE ORIGINAL
; AMIGA GAME: an OPPONENT's tackle wipes your held fire button's shot charge,
; and it cannot restart while the button is down, so holding fire through a
; challenge never shoots until you let go and press again. Default false
; (fixed). Your OWN tackle still spends the press either way — that half is
; deliberate in the original. See team_control.c.
fire_hold_lockout=false
; contest_own_ratings: true | false. When two players contest the ball the game
; rolls a dice weighted by tackling and ball control. The ORIGINAL rates one of the
; two sides by a team-mate (the player with the opponent's line-up number), in both
; the Amiga and PC releases. true rates each side by the man actually at the ball.
; Default false: the original. OFFLINE matches only -- an online match always
; plays the original's. See docs/BALL_CONTEST.md.
contest_own_ratings=false
; style: amiga | dos. The Amiga release is the definitive one and what this
; port is reverse engineered from; dos is the PC release's 70 FPS physics,
; timers and formations, and its 320x200 view -- the view is part of how it
; plays (what is on screen decides which players the game picks), so the
; style sets both. Online, the game plays the HOST's style.

style=amiga
[replays]
; auto_save: true | false — every match is recorded to LATEST.SRP in the save
; folder and can be watched from HIGHLIGHTS -> LOAD. true also keeps a dated
; copy of each (MMDDHHMM.SRP), so a match is not overwritten by the next one.
auto_save=false
[netplay]
; matchmaker: the server MULTIPLAYER logs in to, as "host" or "host:port"
; (default port 19602). Empty means the public server, online.openswos.net. You can type it
; on the login screen instead -- it is saved back here.
matchmaker=
; name: your name on the MULTIPLAYER login screen. Typed there and saved back
; here while REMEMBER LOGIN INFO is on.
name=
; remember_login: true | false -- the login screen's REMEMBER LOGIN INFO switch.
remember_login=true
; record: stream every live match to a recorder, which keeps it and compares the
; two players' frames to catch a desync: "server" (the default: the matchmaker
; above, for the matches it arranges), a recorder of your own as "host" or
; "host:port" (every match), or "off". Empty means the default.
record=server
; reports: true | false -- after an online match, send both players' SWOS.log and
; HOW WAS THE MATCH? to the other player and the server, zipped (a copy is kept in
; save/netplay either way). false: nothing leaves this machine.
reports=true
; prediction: true | false -- keep what each player SAW of an online match in its
; replay: how many of the other player's inputs were guesses on each frame, the
; rollbacks, and where players were drawn against where they really were. The
; playback page shows it (docs/PLAYBACK.md). A replay plays the same without it.
prediction=true
[graphics]
; style: amiga | dos | 2020. Which artwork the pitch, HUD and menus are drawn
; from. Gameplay is unaffected -- this is only what it looks like.

style=amiga
; sprites: auto | amiga | jaguar. The Atari Jaguar redrew the players at 256
; colours -- same animations, more shades (docs/JAGUAR.md). auto is the
; built-in default, amiga.

sprites=amiga
; pitch_maps: true | false. With style = dos, draw a pitch from its Tile Agent
; map (grafs_dos/pitch<N>.tmj) where there is one, and from the game's own files
; where there is not (docs/PITCH_MAPS.md). Only the picture: the match itself,
; online and in replays, is the same either way.

pitch_maps=false
; outfit_shading: true | false. Shade the kit into four tones per colour, the
; way the Jaguar art does. false draws each kit colour flat, exactly as the
; 16-colour Amiga game does.

outfit_shading=true
; shadow_shading: true | false. Shade the drop shadow, tinted from the grass of
; the pitch being played on. false uses SWOS's own colour 8 -- one near-black
; that reads on any pitch, and costs the palette nothing.

shadow_shading=true
; hair_shading: true | false. Shade hair the game draws in a single colour (a
; black head), by shade_step like the kit. false draws it flat, exactly as the
; 16-colour Amiga game does. Hair the game shades itself (ginger, blond) is
; the game's own either way.

hair_shading=true
; shade_step: 1..5. How far apart the four kit shades are, in sixteenths:
; 16, 16-N, 16-2N, 16-3N. The Jaguar's own artwork used about 3, which takes
; a near-white sock down to 37.5% and reads as dark grey; 2 keeps it white.
; Hair shading uses it too: black hair's highlight is lifted by 3 x N.

shade_step=2
; kit_art: amiga | jaguar. The shirts, shorts and socks drawn on the UNIFORM
; screen: the Amiga's flat drawings, or the Atari Jaguar's shaded ones (shaded by
; shade_step, like its sprites). That screen only: it changes nothing in a match,
; and does not follow the sprites setting.

kit_art=jaguar
[arcade]
; enabled: true | false — boot straight to attract mode, no main menu
enabled=false
; mode: arcade game mode (F2 service menu). Currently: GOLDEN GOAL
mode=GOLDEN GOAL
; game rules (F2 service menu). game_seconds 10..600;  golden_goal/penalties_on_draw/goal_replay: true | false
game_seconds=45
golden_goal=true
penalties_on_draw=true
goal_replay=true
; attract_audio: music (HERO only) | sfx (reel crowd only) | music+sfx (both, default)
attract_audio=music+sfx
; gameplay: amiga (50fps feel) | dos (70fps). Picks attract_mode/<mode> reels too
gameplay=amiga
; cabinet key bindings (SDL key names; MAME layout 5/6 = coin P1/P2, 1/2 = start, F2 = service)
key_p1_credit=5
key_p1_start=1
key_p2_credit=6
key_p2_start=2
key_service=F2
[testing]
; no_injuries_cards: true | false -- FOR TESTING A CAREER: nobody is booked, sent off,
; injured or suspended, so VIEW RESULT runs through a season without stopping.
; Offline only: an online match always plays the real rules.
no_injuries_cards=false
[general]
; language: en | de | fr | es | it | nl
language=en
; currency: pound | dollar | euro
currency=pound
; assets_reminder_off: set by "Don't remind me" on the reminder that your game data was made by
; an older OpenSWOS Setup -- the data versions it was about. Empty: remind (src/assets_check.c).
assets_reminder_off=
; world: 9697 | 2627 -- the football world: its countries, clubs and competitions
; (docs/WORLD_2026_27.md): SWOS 96/97, or World 2026-27 once OpenSWOS Setup has
; imported its data. A save is played in the world it was made in.
world=9697
