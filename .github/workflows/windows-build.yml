name: Windows portable build

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  windows:
    runs-on: windows-latest
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - uses: actions/checkout@v4
      - uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: true
          install: >-
            mingw-w64-x86_64-gcc
            mingw-w64-x86_64-SDL2
            mingw-w64-x86_64-pkgconf
            make
      - name: Check required project files
        run: |
          test -f sorgenti/Makefile
          test -f sorgenti/src/menus.c
          test -d data
      - name: Build Windows executable
        run: |
          make -C sorgenti -j4 NETPLAY=0
          test -s sorgenti/bin/SWOS.exe
      - name: Assemble portable game
        run: |
          mkdir -p dist/SWOS-Expanded
          cp sorgenti/bin/SWOS.exe dist/SWOS-Expanded/SWOS-Expanded.exe
          cp /mingw64/bin/SDL2.dll dist/SWOS-Expanded/
          for dir in data assets data_json amiga sound_dos grafs_arcade sound grafs_aga grafs; do
            if test -d "$dir"; then cp -r "$dir" dist/SWOS-Expanded/; fi
          done
          for f in ASSETS.ini README.md; do
            if test -f "$f"; then cp "$f" dist/SWOS-Expanded/; fi
          done
      - uses: actions/upload-artifact@v4
        with:
          name: SWOS-Expanded-Windows
          path: dist/SWOS-Expanded/
          if-no-files-found: error
