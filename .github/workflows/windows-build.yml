name: Windows portable build

on:
  push:
    branches: [main, 'release/0.10.40']
    paths-ignore:
      - 'SWOS.exe'
      - 'SDL2.dll'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - uses: actions/checkout@v4
      - uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: true
          install: >-
            mingw-w64-x86_64-gcc
            mingw-w64-x86_64-SDL2
            mingw-w64-x86_64-pkgconf
            make
      - name: Check required project files
        run: |
          test -f sorgenti/Makefile
          test -f sorgenti/src/menus.c
          test -d data
      - name: Build Windows executable
        run: |
          make -C sorgenti -j4 NETPLAY=0
          test -s sorgenti/bin/SWOS.exe
      - name: Assemble portable game
        run: |
          mkdir -p dist/SWOS-Expanded
          cp sorgenti/bin/SWOS.exe dist/SWOS-Expanded/SWOS.exe
          cp /mingw64/bin/SDL2.dll dist/SWOS-Expanded/
          for dir in data assets data_json amiga sound_dos grafs_arcade sound grafs_aga grafs; do
            if test -d "$dir"; then cp -r "$dir" dist/SWOS-Expanded/; fi
          done
          for f in ASSETS.ini README.md; do
            if test -f "$f"; then cp "$f" dist/SWOS-Expanded/; fi
          done
      - uses: actions/upload-artifact@v4
        with:
          name: SWOS-Expanded-Windows
          path: dist/SWOS-Expanded/
          if-no-files-found: error
      - name: Commit executable to release branch for git pull
        if: github.ref == 'refs/heads/release/0.10.40'
        shell: pwsh
        run: |
          Copy-Item sorgenti/bin/SWOS.exe SWOS.exe -Force
          Copy-Item dist/SWOS-Expanded/SDL2.dll SDL2.dll -Force
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f SWOS.exe SDL2.dll
          if (git diff --cached --quiet) {
            Write-Host "Executable unchanged"
          } else {
            git commit -m "Build SWOS.exe for git pull [skip ci]"
            git push origin HEAD:release/0.10.40
          }
      - name: Prepare release ZIPs
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist/update | Out-Null
          Copy-Item sorgenti/bin/SWOS.exe dist/update/SWOS.exe
          Compress-Archive -Path dist/SWOS-Expanded/* -DestinationPath dist/SWOS-Expanded-0.10.40-FULL.zip -Force
          Compress-Archive -Path dist/update/* -DestinationPath dist/SWOS-Expanded-0.10.40-UPDATE.zip -Force
      - name: Publish 0.10.40 GitHub Release
        if: github.ref == 'refs/heads/release/0.10.40'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if (gh release view v0.10.40 2>$null) {
            gh release upload v0.10.40 dist/SWOS-Expanded-0.10.40-FULL.zip dist/SWOS-Expanded-0.10.40-UPDATE.zip --clobber
          } else {
            gh release create v0.10.40 dist/SWOS-Expanded-0.10.40-FULL.zip dist/SWOS-Expanded-0.10.40-UPDATE.zip --target "${{ github.sha }}" --title "SWOS Expanded 0.10.40" --notes "FULL includes game resources; UPDATE contains SWOS.exe only." --prerelease
          }
